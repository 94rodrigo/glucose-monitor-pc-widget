name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GlucoWidget-windows
            binary: dist/GlucoWidget.exe
          - os: ubuntu-latest
            artifact: GlucoWidget-linux
            binary: dist/GlucoWidget
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: Build executable
        run: pyinstaller packaging/glucowidget.spec
      - name: Self-test the packaged app
        shell: bash
        run: |
          "${{ matrix.binary }}" --selftest selftest-report.txt || true
          cat selftest-report.txt
          grep -q "^RESULT OK" selftest-report.txt
      - name: Check Windows Credential Manager backend
        if: runner.os == 'Windows'
        shell: bash
        run: grep -q "keyring backend=WinVaultKeyring roundtrip=ok" selftest-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    name: Publish latest build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          mkdir release
          cp artifacts/GlucoWidget-windows/GlucoWidget.exe release/GlucoWidget-windows.exe
          cp artifacts/GlucoWidget-linux/GlucoWidget release/GlucoWidget-linux
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the latest commit on main (${GITHUB_SHA::7}). Not code-signed. Verify downloads with SHA256SUMS.txt. On Linux run chmod +x GlucoWidget-linux first."
