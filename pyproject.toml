[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucowidget"
version = "0.1.0"
description = "Widget de desktop que mostra a glicemia do FreeStyle Libre (LibreLinkUp) em tempo real, com análise opcional por IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "keyring>=24",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
glucowidget = "glucowidget.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glucowidget = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
